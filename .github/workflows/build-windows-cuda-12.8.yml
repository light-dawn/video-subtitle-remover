name: Build Windows CUDA 12.8

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' backend/config.py)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Sync locked build environment
        run: uv sync --locked --group build

      - name: Export QPT runtime manifest from uv.lock
        run: >
          uv export --locked --no-hashes --no-emit-project
          --no-emit-package torch --no-emit-package torchvision
          --output-file requirements-qpt.txt

      - name: Find QPT site-packages
        shell: bash
        run: |
          SITE_PACKAGES=$(uv run --group build python -c "import site; print(site.getsitepackages()[0])")
          SITE_PACKAGES_UNIX=$(cygpath -u "$SITE_PACKAGES")
          echo "SITE_PACKAGES_UNIX=$SITE_PACKAGES_UNIX" >> "$GITHUB_ENV"

      - name: Patch QPT dependency inspection
        shell: bash
        run: sed -i '98c\        try:\n            dep = pkg.requires()\n        except TypeError:\n            continue' "${SITE_PACKAGES_UNIX}/qpt/kernel/qpackage.py"

      - name: Build QPT archive
        env:
          QPT_Action: "True"
        shell: bash
        run: |
          uv run --group build python backend/tools/makedist.py --cuda 12.8
          mv ../vsr_out ./vsr_out
          cp ./vsr_out/Debug/Debug-进入虚拟环境.cmd ./vsr_out/Release/
          sed -i 's/force=False)/force=False)\n            exit(-1)/g' ./vsr_out/*/Python/Lib/site-packages/qpt/executor.py

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsr-v${{ env.VERSION }}-windows-nvidia-cuda-12.8-debug
          path: vsr_out/Debug/

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsr-v${{ env.VERSION }}-windows-nvidia-cuda-12.8-release
          path: vsr_out/Release/

      - name: Package release archive
        shell: bash
        run: |
          cd vsr_out/Release
          7z a -t7z -mx=9 -m0=LZMA2 -ms=on -mfb=64 -md=32m -mmt=on -v2000m "vsr-v${{ env.VERSION }}-windows-nvidia-cuda-12.8.7z" *

      - name: Create prerelease
        uses: softprops/action-gh-release@v1
        with:
          prerelease: true
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Video Subtitle Remover v${{ env.VERSION }}
          files: vsr_out/Release/vsr-v${{ env.VERSION }}-windows-nvidia-cuda-12.8.7z*
